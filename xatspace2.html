<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My xatspace</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none;
    }

    html, body {
      overflow: hidden;
      background: #000;
      cursor: none;
    }

    #background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      user-drag: none;
    }

    #starfield {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background-color: #000000;
      opacity: 0;
      transition: opacity 7s ease-in-out, background-color 2.2s ease-in-out;
    }

    #cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 22px;
      height: 22px;
      pointer-events: none;
      z-index: 10;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      color: #c8d0ff;
      box-shadow: 0 0 10px 2px currentColor, 0 0 22px 5px currentColor;
      opacity: 0;
      transition: color 1.8s ease, opacity 0.9s ease;
    }

    #cursor::before,
    #cursor::after {
      content: '';
      position: absolute;
      background: currentColor;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #cursor::before {
      width: 16px;
      height: 2px;
    }

    #cursor::after {
      width: 2px;
      height: 16px;
    }
  </style>
</head>
<body>
  <img id="background" src="https://xatimg.com/image/QEbpfSMvGS5d.gif" alt="Moon" draggable="false">
  <canvas id="starfield"></canvas>
  <div id="overlay"></div>
  <div id="cursor"></div>

  <script>
    const STAR_COUNT = 140;
    const MAX_PARTICLES = 70;
    const PARTICLE_SPAWN_CHANCE = 0.35;

    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const cursor = document.getElementById('cursor');

    let width, height;
    let stars = [];
    let particles = [];
    let mouseX = 0;
    let mouseY = 0;
    let isOverPage = false;

    const moods = [
      { color: '#000000', particle: 'rgba(220,220,255,', glow: '#c8d0ff' },
      { color: '#3b0a0a', particle: 'rgba(255,120,120,', glow: '#ff6b6b' },
      { color: '#1a0a2e', particle: 'rgba(180,140,255,', glow: '#b28aff' },
      { color: '#05051a', particle: 'rgba(120,160,255,', glow: '#7aa2ff' },
      { color: '#0a1a1a', particle: 'rgba(120,220,200,', glow: '#7ad4c4' }
    ];
    let moodIndex = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      createStars();
    }

    function createStars() {
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.4 + 0.3,
          baseAlpha: Math.random() * 0.5 + 0.2,
          twinkleSpeed: Math.random() * 0.015 + 0.005,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function spawnParticle(x, y, burst = false) {
      if (particles.length >= MAX_PARTICLES) return;

      const count = burst ? 8 : 1;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = burst ? Math.random() * 1.8 + 0.6 : Math.random() * 0.6 + 0.15;

        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: Math.random() * 0.012 + 0.006,
          size: Math.random() * 2.2 + 1,
          color: moods[moodIndex].particle
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.phase += s.twinkleSpeed;
        const alpha = s.baseAlpha + Math.sin(s.phase) * 0.25;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(230, 235, 255, ${Math.max(0.05, alpha)})`;
        ctx.fill();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fillStyle = p.color + (p.life * 0.7) + ')';
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    function showCursor() {
      isOverPage = true;
      cursor.style.opacity = '1';
      overlay.style.opacity = '0.65';
    }

    function hideCursor() {
      isOverPage = false;
      cursor.style.opacity = '0';
      overlay.style.opacity = '0';
    }

    window.addEventListener('resize', resize);

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';

      if (!isOverPage) {
        showCursor();
      } else {
        cursor.style.opacity = '1';
      }

      if (Math.random() < PARTICLE_SPAWN_CHANCE) {
        spawnParticle(mouseX, mouseY);
      }
    });

    window.addEventListener('mouseenter', showCursor);
    window.addEventListener('mouseleave', hideCursor);

    document.addEventListener('mouseout', (e) => {
      if (!e.relatedTarget && !e.toElement) {
        hideCursor();
      }
    });

    window.addEventListener('click', () => {
      moodIndex = (moodIndex + 1) % moods.length;
      overlay.style.backgroundColor = moods[moodIndex].color;
      cursor.style.color = moods[moodIndex].glow;
      spawnParticle(mouseX, mouseY, true);
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());

    resize();
    requestAnimationFrame(animate);
    overlay.style.backgroundColor = moods[0].color;
    cursor.style.color = moods[0].glow;
  </script>
</body>
</html>
